[project]
name = "cgen"
version = "0.1.0"
description = "OpenAPI 3.1 -> typsicherer Java Codegenerator"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cgen*"]
