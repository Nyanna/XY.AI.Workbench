[package]
name = "rustir"
version = "0.1.0"
edition = "2021"
description = "Parse Rust projects into an IR, transform it and emit code again"

[lib]
name = "rustir"
path = "src/lib.rs"

[[bin]]
name = "rustir"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
