[package]
name = "xy-ai-rag"
version = "0.1.0"
edition = "2021"
description = "xy.ai.rag - Layered Anytime Retrieval Engine"

[lib]
name = "xy_ai_rag"
path = "src/lib.rs"

[[bin]]
name = "xyrag"
path = "src/bin/xyrag.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
rkyv = { version = "0.7", features = ["validation"] }
glob = "0.3"
lru = "0.12"
regex = "1"
unicode-normalization = "0.1"
thiserror = "2.0.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.3"
crossbeam = "0.8.5"
crossbeam-queue = "0.3.14"
parking_lot = "0.12.5"
arc-swap = "1.9.2"
half = "2.7.1"
memmap2 = "0.9.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parquet = "60.0.0"
arrow = "60.0.0"
tokenizers = { version = "0.23.2", default-features = false }
safetensors = "0.8.0"
candle-core = { version = "0.11.0", optional = true, default-features = false }
candle-transformers = { version = "0.11.0", optional = true, default-features = false }
cudarc = { version = "=0.19.9", optional = true }

[features]
default = []
candle = ["dep:candle-core"]
cuda = ["candle", "dep:candle-transformers", "dep:cudarc", "candle-core/cuda", "candle-transformers/cuda"]
mock = []
json = ["tracing-subscriber/json"]

[dev-dependencies]
proptest = "1"
criterion = "0.5"
mockall = "0.15.0"
loom = "0.7"
shuttle = "0.7"
rand = "0.8"
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "trie_bench"
harness = false
