openapi: "3.2.0"
info:
  title: "Anthropic Messages API"
servers:
  - url: "https://api.anthropic.com"
paths:
  /v1/messages:
    post:
      summary: "Create a Message"
      description: "Send a structured list of input messages with text and/or image content, and the model will generate the next message in the conversation.\n\nThe Messages API can be used for either single queries or stateless multi-turn conversations.\n\nLearn more about the Messages API in our user guide"
      operationId: "messages_post"
      parameters:
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "anthropic-user-profile-id"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The user profile ID to attribute this request to. Use when acting on behalf of a party other than your organization. Requires the `user-profiles` beta header."
            title: "Anthropic-User-Profile-Id"
          description: "The user profile ID to attribute this request to. Use when acting on behalf of a party other than your organization. Requires the `user-profiles` beta header."
      responses:
        '200':
          description: "Message object."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageParams"
        required: true
  /v1/messages/batches:
    post:
      summary: "Create a Message Batch"
      description: "Send a batch of Message creation requests.\n\nThe Message Batches API can be used to process multiple Messages API requests at once. Once a Message Batch is created, it begins processing immediately. Batches can take up to 24 hours to complete.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_post"
      parameters:
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "anthropic-user-profile-id"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The user profile ID to attribute the requests in this batch to. Use when acting on behalf of a party other than your organization. Requires the `user-profiles` beta header. Applies to every request in the batch; an individual request whose `user_profile_id` body field conflicts with this header is errored."
            title: "Anthropic-User-Profile-Id"
          description: "The user profile ID to attribute the requests in this batch to. Use when acting on behalf of a party other than your organization. Requires the `user-profiles` beta header. Applies to every request in the batch; an individual request whose `user_profile_id` body field conflicts with this header is errored."
      responses:
        '200':
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBatch"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBatchParams"
        required: true
    get:
      summary: "List Message Batches"
      description: "List all Message Batches within a Workspace. Most recently created batches are returned first.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_list"
      parameters:
        - name: "before_id"
          in: "query"
          required: false
          schema:
            type: "string"
            description: "ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately before this object."
            title: "Before Id"
          description: "ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately before this object."
        - name: "after_id"
          in: "query"
          required: false
          schema:
            type: "string"
            description: "ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately after this object."
            title: "After Id"
          description: "ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately after this object."
        - name: "limit"
          in: "query"
          required: false
          schema:
            type: "integer"
            maximum: 1000
            minimum: 1
            description: "Number of items to return per page.\n\nDefaults to `20`. Ranges from `1` to `1000`."
            default: 20
            title: "Limit"
          description: "Number of items to return per page.\n\nDefaults to `20`. Ranges from `1` to `1000`."
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "x-api-key"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
            title: "X-Api-Key"
          description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
      responses:
        '200':
          description: "Successful Response"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/messages/batches/{message_batch_id}:
    get:
      summary: "Retrieve a Message Batch"
      description: "This endpoint is idempotent and can be used to poll for Message Batch completion. To access the results of a Message Batch, make a request to the `results_url` field in the response.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_retrieve"
      parameters:
        - name: "message_batch_id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "ID of the Message Batch."
            title: "Message Batch Id"
          description: "ID of the Message Batch."
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "x-api-key"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
            title: "X-Api-Key"
          description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
      responses:
        '200':
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBatch"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: "Delete a Message Batch"
      description: "Delete a Message Batch.\n\nMessage Batches can only be deleted once they've finished processing. If you'd like to delete an in-progress batch, you must first cancel it.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_delete"
      parameters:
        - name: "message_batch_id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "ID of the Message Batch."
            title: "Message Batch Id"
          description: "ID of the Message Batch."
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "x-api-key"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
            title: "X-Api-Key"
          description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
      responses:
        '200':
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMessageBatchResponse"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/messages/batches/{message_batch_id}/cancel:
    post:
      summary: "Cancel a Message Batch"
      description: "Batches may be canceled any time before processing ends. Once cancellation is initiated, the batch enters a `canceling` state, at which time the system may complete any in-progress, non-interruptible requests before finalizing cancellation.\n\nThe number of canceled requests is specified in `request_counts`. To determine which requests were canceled, check the individual results within the batch. Note that cancellation may not result in any canceled requests if they were non-interruptible.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_cancel"
      parameters:
        - name: "message_batch_id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "ID of the Message Batch."
            title: "Message Batch Id"
          description: "ID of the Message Batch."
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
      responses:
        '200':
          description: "Successful Response"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageBatch"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/messages/batches/{message_batch_id}/results:
    get:
      summary: "Retrieve Message Batch results"
      description: "Streams the results of a Message Batch as a `.jsonl` file.\n\nEach line in the file is a JSON object containing the result of a single request in the Message Batch. Results are not guaranteed to be in the same order as requests. Use the `custom_id` field to match results to requests.\n\nLearn more about the Message Batches API in our user guide"
      operationId: "message_batches_results"
      parameters:
        - name: "message_batch_id"
          in: "path"
          required: true
          schema:
            type: "string"
            description: "ID of the Message Batch."
            title: "Message Batch Id"
          description: "ID of the Message Batch."
        - name: "anthropic-version"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
            title: "Anthropic-Version"
          description: "The version of the Claude API you want to use.\n\nRead more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning)."
        - name: "x-api-key"
          in: "header"
          required: false
          schema:
            type: "string"
            description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
            title: "X-Api-Key"
          description: "Your unique API key for authentication.\n\nThis key is required in the header of all API requests, to authenticate your account and access Anthropic's services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace."
      responses:
        '200':
          description: "Successful Response"
          content:
            application/x-jsonl:
              schema:
                $ref: "#/components/schemas/MessageBatchIndividualResponse"
        4XX:
          description: "Error response.\n\nSee our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    InputContentBlock:
      discriminator:
        mapping:
          bash_code_execution_tool_result: "#/components/schemas/RequestBashCodeExecutionToolResultBlock"
          code_execution_tool_result: "#/components/schemas/RequestCodeExecutionToolResultBlock"
          container_upload: "#/components/schemas/RequestContainerUploadBlock"
          document: "#/components/schemas/RequestDocumentBlock"
          image: "#/components/schemas/RequestImageBlock"
          redacted_thinking: "#/components/schemas/RequestRedactedThinkingBlock"
          search_result: "#/components/schemas/RequestSearchResultBlock"
          server_tool_use: "#/components/schemas/RequestServerToolUseBlock"
          text: "#/components/schemas/RequestTextBlock"
          text_editor_code_execution_tool_result: "#/components/schemas/RequestTextEditorCodeExecutionToolResultBlock"
          thinking: "#/components/schemas/RequestThinkingBlock"
          tool_result: "#/components/schemas/RequestToolResultBlock"
          tool_search_tool_result: "#/components/schemas/RequestToolSearchToolResultBlock"
          tool_use: "#/components/schemas/RequestToolUseBlock"
          web_fetch_tool_result: "#/components/schemas/RequestWebFetchToolResultBlock"
          web_search_tool_result: "#/components/schemas/RequestWebSearchToolResultBlock"
        propertyName: "type"
      oneOf:
        - $ref: "#/components/schemas/RequestTextBlock"
          description: "Regular text content."
        - $ref: "#/components/schemas/RequestThinkingBlock"
          description: "A block specifying internal thinking by the model."
    ErroredResult:
      properties:
        error:
          $ref: "#/components/schemas/ErrorResponse"
        type:
          const: "errored"
          default: "errored"
          title: "Type"
          type: "string"
      required:
        - "error"
        - "type"
      title: "ErroredResult"
      type: "object"
    BillingError:
      properties:
        message:
          default: "Billing error"
          title: "Message"
          type: "string"
        type:
          const: "billing_error"
          default: "billing_error"
          title: "Type"
          type: "string"
      required:
        - "message"
        - "type"
      title: "BillingError"
      type: "object"
    OutputTokensDetails:
      properties:
        thinking_tokens:
          default: 0
          description: "Number of output tokens the model generated as internal reasoning, including\nthe thinking-block delimiter tokens.\n\nReflects the raw reasoning the model produced, not the (possibly shorter)\nsummarized thinking text returned in the response body. Computed by\nre-tokenizing the raw reasoning text, so it may differ from the model's exact\ngeneration count by a small number of tokens. Always ≤ `output_tokens`;\n`output_tokens - thinking_tokens` approximates the non-reasoning output."
          minimum: 0
          title: "Thinking Tokens"
          type: "integer"
      required:
        - "thinking_tokens"
      title: "OutputTokensDetails"
      type: "object"
    RequestThinkingBlock:
      additionalProperties: false
      properties:
        signature:
          description: "The `signature` value of this thinking block, exactly as returned by the API in a previous response. Used to verify that the block was generated by Claude.\n\nThinking blocks must be passed back unmodified and in their original order; a modified block results in a 400 `invalid_request_error`."
          title: "Signature"
          type: "string"
        thinking:
          description: "The `thinking` text of this block as returned by the API."
          title: "Thinking"
          type: "string"
        type:
          const: "thinking"
          title: "Type"
          type: "string"
      required:
        - "signature"
        - "thinking"
        - "type"
      title: "RequestThinkingBlock"
      type: "object"
    ThinkingConfigAdaptive:
      additionalProperties: false
      properties:
        display:
          anyOf:
            - $ref: "#/components/schemas/ThinkingDisplayMode"
            - type: "null"
          description: "Controls how thinking content appears in the response. When set to `summarized`, thinking is returned normally. When set to `omitted`, thinking content is redacted but a signature is returned for multi-turn continuity. Defaults to `summarized`."
        type:
          const: "adaptive"
          title: "Type"
          type: "string"
      required:
        - "type"
      title: "ThinkingConfigAdaptive"
      type: "object"
    InputSchema:
      additionalProperties: true
      properties:
        properties:
          anyOf:
            - additionalProperties: true
              type: "object"
            - type: "null"
          title: "Properties"
        required:
          anyOf:
            - items:
                type: "string"
              type: "array"
            - type: "null"
          title: "Required"
        type:
          const: "object"
          title: "Type"
          type: "string"
      required:
        - "type"
      title: "InputSchema"
      type: "object"
    RefusalStopDetails:
      description: "Structured information about a refusal."
      properties:
        category:
          anyOf:
            - $ref: "#/components/schemas/RefusalCategory"
            - type: "null"
          default: null
          description: "The policy category that triggered the refusal.\n\n`null` when the refusal doesn't map to a named category."
        explanation:
          anyOf:
            - type: "string"
            - type: "null"
          default: null
          description: "Human-readable explanation of the refusal.\n\nThis text is not guaranteed to be stable. `null` when no explanation is available for the category."
          examples:
            - "This request was declined because it conflicts with Anthropic's Usage Policy."
          title: "Explanation"
        type:
          const: "refusal"
          default: "refusal"
          title: "Type"
          type: "string"
      required:
        - "category"
        - "explanation"
        - "type"
      title: "RefusalStopDetails"
      type: "object"
    MessageBatchIndividualRequestParams:
      additionalProperties: false
      properties:
        custom_id:
          description: "Developer-provided ID created for each request in a Message Batch. Useful for matching results to requests, as results may be given out of request order.\n\nMust be unique for each request within the Message Batch."
          examples:
            - "my-custom-id-1"
          maxLength: 64
          minLength: 1
          pattern: "^[a-zA-Z0-9_-]{1,64}$"
          title: "Custom Id"
          type: "string"
        params:
          $ref: "#/components/schemas/CreateMessageParams"
          description: "Messages API creation parameters for the individual request.\n\nSee the [Messages API reference](https://platform.claude.com/docs/en/api/messages) for full documentation on available parameters."
      required:
        - "custom_id"
        - "params"
      title: "MessageBatchIndividualRequestParams"
      type: "object"
    ToolChoice:
      description: "How the model should use the provided tools. The model can use a specific tool, any available tool, decide by itself, or not use tools at all."
      discriminator:
        mapping:
          any: "#/components/schemas/ToolChoiceAny"
          auto: "#/components/schemas/ToolChoiceAuto"
          none: "#/components/schemas/ToolChoiceNone"
          tool: "#/components/schemas/ToolChoiceTool"
        propertyName: "type"
      oneOf:
        - $ref: "#/components/schemas/ToolChoiceAuto"
        - $ref: "#/components/schemas/ToolChoiceAny"
        - $ref: "#/components/schemas/ToolChoiceTool"
        - $ref: "#/components/schemas/ToolChoiceNone"
      title: "Tool Choice"
    JsonOutputFormat:
      additionalProperties: false
      properties:
        schema:
          additionalProperties: true
          description: "The JSON schema of the format"
          title: "Schema"
          type: "object"
        type:
          const: "json_schema"
          title: "Type"
          type: "string"
      required:
        - "schema"
        - "type"
      title: "JsonOutputFormat"
      type: "object"
    RequestCounts:
      properties:
        canceled:
          type: "integer"
          title: "Canceled"
          description: "Number of requests in the Message Batch that have been canceled.\n\nThis is zero until processing of the entire Message Batch has ended."
          default: 0
          examples:
            - 10
        errored:
          type: "integer"
          title: "Errored"
          description: "Number of requests in the Message Batch that encountered an error.\n\nThis is zero until processing of the entire Message Batch has ended."
          default: 0
          examples:
            - 30
        expired:
          type: "integer"
          title: "Expired"
          description: "Number of requests in the Message Batch that have expired.\n\nThis is zero until processing of the entire Message Batch has ended."
          default: 0
          examples:
            - 10
        processing:
          type: "integer"
          title: "Processing"
          description: "Number of requests in the Message Batch that are processing."
          default: 0
          examples:
            - 100
        succeeded:
          type: "integer"
          title: "Succeeded"
          description: "Number of requests in the Message Batch that have completed successfully.\n\nThis is zero until processing of the entire Message Batch has ended."
          default: 0
          examples:
            - 50
      type: "object"
      required:
        - "canceled"
        - "errored"
        - "expired"
        - "processing"
        - "succeeded"
      title: "RequestCounts"
    ThinkingConfigEnabled:
      additionalProperties: false
      properties:
        budget_tokens:
          description: "Determines how many tokens Claude can use for its internal reasoning process. Larger budgets can enable more thorough analysis for complex problems, improving response quality.\n\nMust be ≥1024 and less than `max_tokens`.\n\nSee [extended thinking](https://platform.claude.com/docs/en/build-with-claude/extended-thinking) for details."
          minimum: 1024
          title: "Budget Tokens"
          type: "integer"
        display:
          anyOf:
            - $ref: "#/components/schemas/ThinkingDisplayMode"
            - type: "null"
          description: "Controls how thinking content appears in the response. When set to `summarized`, thinking is returned normally. When set to `omitted`, thinking content is redacted but a signature is returned for multi-turn continuity. Defaults to `summarized`."
        type:
          const: "enabled"
          title: "Type"
          type: "string"
      required:
        - "budget_tokens"
        - "type"
      title: "ThinkingConfigEnabled"
      type: "object"
    StopReason:
      enum:
        - "end_turn"
        - "max_tokens"
        - "stop_sequence"
        - "tool_use"
        - "pause_turn"
        - "refusal"
        - "model_context_window_exceeded"
      type: "string"
    APIError:
      properties:
        message:
          default: "Internal server error"
          title: "Message"
          type: "string"
        type:
          const: "api_error"
          default: "api_error"
          title: "Type"
          type: "string"
      required:
        - "message"
        - "type"
      title: "APIError"
      type: "object"
    Metadata:
      additionalProperties: false
      properties:
        user_id:
          anyOf:
            - maxLength: 512
              type: "string"
            - type: "null"
          description: "An external identifier for the user who is associated with the request.\n\nThis should be a uuid, hash value, or other opaque identifier. Anthropic may use this id to help detect abuse. Do not include any identifying information such as name, email address, or phone number."
          examples:
            - "13803d75-b4b5-4c3e-b2a2-6f21399b021b"
